<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReturnVault | Vendor Recovery Desk</title>
  <!-- In-browser OCR engine -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding: 24px; }
    .container { max-width: 1200px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--card-border); }
    h1 { font-size: 1.75rem; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 10px; }
    .badge { background: #1e3a8a; color: #93c5fd; padding: 4px 10px; font-size: 0.75rem; border-radius: 9999px; font-weight: 600; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 18px; }
    .stat-title { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-value { font-size: 1.6rem; font-weight: 700; margin-top: 6px; }
    .val-pending { color: var(--warning); }
    .val-recovered { color: var(--success); }
    .grid-layout { display: grid; grid-template-columns: 360px 1fr; gap: 24px; }
    @media (max-width: 900px) { .grid-layout { grid-template-columns: 1fr; } }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 20px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .card h2 { font-size: 1.15rem; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
    input, select { width: 100%; background: #0f172a; border: 1px solid var(--card-border); border-radius: 6px; padding: 10px; color: var(--text); font-size: 0.9rem; }
    input:focus, select:focus { outline: none; border-color: var(--primary); }
    
    /* Scanner styles */
    .scan-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; background: var(--accent); color: white; border: none; border-radius: 6px; padding: 10px; font-weight: 600; cursor: pointer; margin-bottom: 16px; transition: background 0.2s; }
    .scan-btn:hover { background: var(--accent-hover); }
    .scan-status { font-size: 0.8rem; color: #c4b5fd; text-align: center; margin-bottom: 12px; display: none; }
    .ocr-preview { width: 100%; max-height: 120px; object-fit: contain; background: #0b1120; border-radius: 6px; margin-bottom: 12px; border: 1px dashed var(--card-border); display: none; }

    button.btn-primary { width: 100%; background: var(--primary); color: white; border: none; border-radius: 6px; padding: 12px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button.btn-primary:hover { background: var(--primary-hover); }
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    th { background: #0f172a; padding: 12px; color: var(--text-muted); border-bottom: 1px solid var(--card-border); font-weight: 600; }
    td { padding: 12px; border-bottom: 1px solid var(--card-border); vertical-align: middle; }
    tr:hover td { background: rgba(255, 255, 255, 0.02); }
    .status-pill { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
    .status-pending { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
    .status-credited { background: rgba(16, 185, 129, 0.15); color: var(--success); }
    .btn-action { background: transparent; border: 1px solid var(--card-border); color: var(--text-muted); border-radius: 4px; padding: 4px 8px; font-size: 0.75rem; cursor: pointer; margin-right: 4px; }
    .btn-action:hover { color: var(--text); border-color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>ReturnVault <span class="badge">Live Desk</span></h1>
      <span style="font-size: 0.85rem; color: var(--text-muted);">Vendor Core & Parts Claim Tracking</span>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-title">Open Claims</div>
        <div class="stat-value" id="statOpenClaims">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Pending Recovery</div>
        <div class="stat-value val-pending" id="statPendingVal">$0.00</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Total Credited</div>
        <div class="stat-value val-recovered" id="statCreditedVal">$0.00</div>
      </div>
    </div>

    <div class="grid-layout">
      <div class="card">
        <div class="card-header">
          <h2>Log Return / Core</h2>
        </div>

        <!-- Photo Capture / Autofill Section -->
        <input type="file" id="photoInput" accept="image/*" capture="environment" style="display: none;" />
        <button type="button" class="scan-btn" onclick="document.getElementById('photoInput').click()">
          📷 Scan Invoice / Label Photo
        </button>
        <img id="imagePreview" class="ocr-preview" alt="Uploaded Receipt Preview" />
        <div id="scanStatus" class="scan-status">Processing image and extracting fields...</div>

        <form id="returnForm">
          <div class="form-group">
            <label>Part Number</label>
            <input type="text" id="partNumber" required placeholder="e.g. FL-820-S" />
          </div>
          <div class="form-group">
            <label>Vendor</label>
            <input type="text" id="vendor" required placeholder="e.g. Motorcraft / OEC" />
          </div>
          <div class="form-group">
            <label>Invoice / PO #</label>
            <input type="text" id="invoiceNumber" placeholder="e.g. INV-90821" />
          </div>
          <div class="form-group">
            <label>Return Type</label>
            <select id="returnReason">
              <option value="Core Return">Core Return</option>
              <option value="Defective / Warranty">Defective / Warranty</option>
              <option value="Customer Return">Customer Return</option>
              <option value="Damaged in Transit">Damaged in Transit</option>
            </select>
          </div>
          <div class="form-group">
            <label>Expected Credit Amount ($)</label>
            <input type="number" id="creditAmount" step="0.01" required placeholder="0.00" />
          </div>
          <div class="form-group">
            <label>Tracking / Claim #</label>
            <input type="text" id="trackingNumber" placeholder="Carrier or vendor tag" />
          </div>
          <button type="submit" class="btn-primary">Add to Ledger</button>
        </form>
      </div>

      <div class="card">
        <h2>Live Claim Ledger</h2>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Part #</th>
                <th>Vendor</th>
                <th>Reason</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="ledgerBody">
              <!-- Entries rendered dynamically -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    let entries = JSON.parse(localStorage.getItem('rv_claims') || '[]');

    function saveAndRender() {
      localStorage.setItem('rv_claims', JSON.stringify(entries));
      renderLedger();
      updateStats();
    }

    function updateStats() {
      let openCount = 0;
      let pendingTotal = 0;
      let creditedTotal = 0;

      entries.forEach(e => {
        const val = parseFloat(e.amount) || 0;
        if (e.status === 'Pending') {
          openCount++;
          pendingTotal += val;
        } else if (e.status === 'Credited') {
          creditedTotal += val;
        }
      });

      document.getElementById('statOpenClaims').innerText = openCount;
      document.getElementById('statPendingVal').innerText = `$${pendingTotal.toFixed(2)}`;
      document.getElementById('statCreditedVal').innerText = `$${creditedTotal.toFixed(2)}`;
    }

    function renderLedger() {
      const tbody = document.getElementById('ledgerBody');
      if (entries.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color: var(--text-muted); padding: 24px;">No claims recorded yet. Add your first return using the form or scan tool.</td></tr>';
        return;
      }

      tbody.innerHTML = entries.map((item, index) => `
        <tr>
          <td>${item.date}</td>
          <td><strong>${item.part}</strong></td>
          <td>${item.vendor}</td>
          <td>${item.reason}</td>
          <td>$${parseFloat(item.amount).toFixed(2)}</td>
          <td><span class="status-pill status-${item.status.toLowerCase()}">${item.status}</span></td>
          <td>
            ${item.status === 'Pending' ? `<button class="btn-action" onclick="setStatus(${index}, 'Credited')">Mark Credited</button>` : ''}
            <button class="btn-action" onclick="deleteEntry(${index})">Remove</button>
          </td>
        </tr>
      `).join('');
    }

    window.setStatus = function(index, newStatus) {
      entries[index].status = newStatus;
      saveAndRender();
    };

    window.deleteEntry = function(index) {
      entries.splice(index, 1);
      saveAndRender();
    };

    document.getElementById('returnForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const newEntry = {
        date: new Date().toLocaleDateString(),
        part: document.getElementById('partNumber').value,
        vendor: document.getElementById('vendor').value,
        invoice: document.getElementById('invoiceNumber').value,
        reason: document.getElementById('returnReason').value,
        amount: document.getElementById('creditAmount').value,
        tracking: document.getElementById('trackingNumber').value,
        status: 'Pending'
      };
      entries.unshift(newEntry);
      saveAndRender();
      e.target.reset();
      document.getElementById('imagePreview').style.display = 'none';
    });

    // Optical Character Recognition (OCR) Autofill Engine
    document.getElementById('photoInput').addEventListener('change', async function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const preview = document.getElementById('imagePreview');
      const status = document.getElementById('scanStatus');

      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
      status.style.display = 'block';
      status.innerText = 'Scanning text from image...';

      try {
        const result = await Tesseract.recognize(file, 'eng', {
          logger: m => {
            if (m.status === 'recognizingtext') {
              status.innerText = `Scanning: ${Math.round(m.progress * 100)}%`;
            }
          }
        });

        const rawText = result.data.text;
        status.innerText = 'Extracting data into fields...';

        // 1. Part Number Detection (e.g., FL-820-S, 8L3Z-6M280-AA, or labeled Part #)
        const partMatch = rawText.match(/(?:Part\s*(?:#|No|Number)?[:\s]*)([A-Z0-9-]+)/i) || 
                          rawText.match(/\b([A-Z0-9]{2,5}-[A-Z0-9]{3,6}(?:-[A-Z0-9]{1,4})?)\b/);
        if (partMatch) {
          document.getElementById('partNumber').value = partMatch[1].replace(/[^A-Za-z0-9-]/g, '').toUpperCase();
        }

        // 2. Known Vendor Matching
        const vendors = ['Motorcraft', 'Ford', 'OEC', 'LKQ', 'Advance', 'AutoZone', 'NAPA', 'Dorman', 'GM Genuine'];
        for (const v of vendors) {
          if (new RegExp(v, 'i').test(rawText)) {
            document.getElementById('vendor').value = v;
            break;
          }
        }

        // 3. Invoice / PO # Detection
        const invMatch = rawText.match(/(?:Inv(?:oice)?|PO|Doc)\s*(?:#|No|Number)?[:\s]*([A-Z0-9-]+)/i);
        if (invMatch) {
          document.getElementById('invoiceNumber').value = invMatch[1];
        }

        // 4. Expected Dollar Amount Detection
        const amountMatch = rawText.match(/(?:Total|Credit|Core|Amount|Due)?\s*\$\s*([0-9]+\.[0-9]{2})/i) ||
                            rawText.match(/\b([0-9]+\.[0-9]{2})\b/);
        if (amountMatch) {
          document.getElementById('creditAmount').value = amountMatch[1];
        }

        // 5. Tracking / Tag Detection (e.g. 1Z... or long shipment tag)
        const trackMatch = rawText.match(/\b(1Z[0-9A-Z]{16})\b/i) || 
                           rawText.match(/(?:Tracking|Tag|Claim)\s*(?:#|No)?[:\s]*([0-9A-Z]+)/i);
        if (trackMatch) {
          document.getElementById('trackingNumber').value = trackMatch[1];
        }

        status.innerText = '✅ Extracted! Verify values below and click Add to Ledger.';
      } catch (err) {
        console.error(err);
        status.innerText = '❌ Failed to read image. Please enter fields manually.';
      }
    });

    renderLedger();
    updateStats();
  </script>
</body>
</html>
